<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>

<style>
body{
    margin: 0;
    font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to right,#3f8efc, #510697);
}

.container{
    border: 2px solid aqua;
    background-color: white;
    width: 350px;
    border-radius: 15px;
    box-shadow: 0px 4px 10px turquoise;
    text-align: center;
    padding: 20px;
}

.container h1{
    margin-bottom: 20px;
}

.input-box{
    width: 100%;
    border: none;
    border-bottom: 3px solid slategrey;
    background: transparent;
    margin: 15px 0;
    padding: 8px;
    display: block;
    outline: none;
}

.textarea{
    height: 80px;
    resize: none;
}

button{
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
    background: linear-gradient(to right, #3a5a87, #8b2be2);
    color: white;
}

button:hover{
    opacity: 0.9;
}
</style>

</head>

<body>

<div class="container">
    <h1>Contact Us</h1>

    <input type="text" placeholder="Name" class="input-box">
    <input type="text" placeholder="Email" class="input-box">
    <textarea placeholder="Message" class="input-box textarea"></textarea>

    <button>Send</button>
</div>

</body>
</html>
