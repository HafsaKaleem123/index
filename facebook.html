<body>
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook – log in or sign up</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    background: #c8dce5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .wrapper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    max-width: 980px;
    width: 100%;
    padding: 20px;
  }
  .left {
    flex: 1;
  }
  .left h1 {
    color: #1877f2;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 8px;
  }
  .left p {
    font-size: 24px;
    color: #1c1e21;
    line-height: 1.3;
  }
  .card {
    background: #fff;
    width: 396px;
    padding: 16px 16px 24px 16px;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(0,0,0,.1), 0 8px 16px rgba(0,0,0,.1);
  }
  .card input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #dddfe2;
    border-radius: 6px;
    font-size: 17px;
  }
  .card input:focus {
    border-color: #1877f2;
    outline: none;
    box-shadow: 0 0 0 2px #e7f3ff;
  }
  .btn-login {
    width: 100%;
    background: #1877f2;
    color: #fff;
    border: none;
    padding: 12px;
    font-size: 20px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .btn-login:hover {
    background: #166fe5;
  }
  .forgot {
    text-align: center;
    margin: 8px 0 16px;
  }
  .forgot a {
    color: #1877f2;
    font-size: 14px;
    text-decoration: none;
  }
  .forgot a:hover {
    text-decoration: underline;
  }
  .divider {
    border-top: 1px solid #dadde1;
    margin: 16px 0;
  }
  .btn-create {
    background: #42b72a;
    color: #fff;
    border: none;
    padding: 12px 16px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    display: block;
    margin: 0 auto;
  }
  .btn-create:hover {
    background: #36a420;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="left">
      <h1>facebook</h1>
      <p>Connect with friends and the world around you on Facebook</p>
    </div>
    <div class="card">
      <form>
        <input type="text" placeholder="Email or phone number">
        <input type="password" placeholder="Password">
        <button class="btn-login" type="submit">Login</button>
        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>
        <div class="divider"></div>
        <button class="btn-create" type="button">Create new account</button>
      </form>
    </div>
  </div>
</body>
</html>
</body>
</html>
